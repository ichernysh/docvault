spring:
  application:
    name: docs-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docvault}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/docvault}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/docvault/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
