# Name shown on the Actions tab and in the PR checks list
name: ci

# Events that start this workflow
on:
  pull_request:
  push:
    branches: [main]

# Rights of the token GitHub gives to every run of this workflow.
# Least privilege: only what the job really needs (it only reads the code).
permissions:
  contents: read

jobs:
  build:
    # The machine the job runs on. It is created fresh for every run: nothing from your laptop is there.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]

    steps:
      # 1. The machine is empty: first get the repository code
      - uses: actions/checkout@v7

      # 2. Install the JDK and restore the Maven cache: our own composite action (needs the checkout above)
      - uses: ./.github/actions/setup-java-maven
        with:
          java-version: ${{ matrix.java }}

      # 3. The same command you run locally: batch mode, full build with all tests, from the module folder
      - name: Build and test
        run: ./mvnw -B verify
        working-directory: docs-api

      # 4. Keep the test reports: the runner is deleted when the run ends.
      # always(): without it the step is skipped when the tests failed, which is exactly when the reports matter.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # artifact names must be unique within a run: every matrix job needs its own
          name: test-reports-java-${{ matrix.java }}
          path: |
            docs-api/target/surefire-reports
            docs-api/target/failsafe-reports
          retention-days: 7

  # Static Terraform checks: no AWS credentials, no state, safe for any PR (including forks).
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Modules are validated through envs/prod, which calls them.
        dir: [ infra/bootstrap, infra/envs/prod ]

    steps:
      - uses: actions/checkout@v7

      # Installs the terraform binary (the runner does not have the version we need)
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.10"

      # Fails if any file under infra/ is not formatted (bootstrap, modules, envs).
      # Only reports, changes nothing (fix locally with `terraform fmt -recursive infra`).
      # Runs once, not per matrix entry: it checks the whole infra/ tree.
      - name: Format check
        if: matrix.dir == 'infra/bootstrap'
        run: terraform fmt -check -recursive infra

      # -backend=false: do not connect to S3, only download providers.
      - name: Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}
