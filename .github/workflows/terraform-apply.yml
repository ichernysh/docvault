name: terraform-apply

# Applies Terraform changes to AWS after a merge to main. Changes real infrastructure.
# Starts on push to main (only when infra or this workflow's own files changed) or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform-apply.yml
      - .github/actions/setup-terraform-aws/**
  workflow_dispatch:

permissions:
  contents: read

# Only one apply at a time. cancel-in-progress is false: cancelling an apply midway can leave the state locked
# and resources half-created, so a second run waits for the first one instead.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # The run pauses here until the required reviewer approves it (Settings -> Environments -> prod).
    # Only the main branch may deploy to this environment.
    environment: prod
    env:
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform-aws
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Save the plan to a file: apply below executes exactly this plan, not a freshly calculated one.
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # With a plan file there is no confirmation prompt: the approval already happened at the environment gate.
      - name: Apply
        run: terraform apply -input=false -no-color tfplan
