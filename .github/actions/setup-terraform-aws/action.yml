name: Setup Terraform and AWS credentials
description: Installs Terraform and configures AWS access from the given keys. Run actions/checkout before it.

# A composite action cannot read the `secrets` context itself: the calling workflow passes the keys as inputs.
inputs:
  aws-access-key-id:
    description: Access key id of the ci-deploy IAM user
    required: true
  aws-secret-access-key:
    description: Secret access key of the ci-deploy IAM user
    required: true
  aws-region:
    description: AWS region
    required: true
  terraform-version:
    description: Terraform version constraint
    required: false
    default: ">=1.10"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    # Exports AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION for the next steps and masks the secret in logs.
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
